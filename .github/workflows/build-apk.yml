name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Platform 35 and Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Debug Keystore
        run: |
          if [ -f debug.keystore ]; then
            echo "debug.keystore already exists; preserving existing keystore."
          elif [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating debug.keystore."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download Offline AI Model Weights (Laya & Needle 3)
        run: |
          mkdir -p app/src/main/assets/models app/src/main/assets/needle
          echo "Downloading Laya ONNX decision model weights from Hugging Face..."
          curl -L -f --retry 3 "https://huggingface.co/onnx-community/laya-multilingual-ONNX/resolve/main/onnx/model_fp16.onnx" -o app/src/main/assets/models/laya_int8.onnx
          echo "Downloading Needle 3 .cact model weights from Hugging Face..."
          curl -L -f --retry 3 "https://huggingface.co/Cactus-Compute/needle3/resolve/main/needle3.cact" -o app/src/main/assets/needle/needle3.cact
          echo "Bundled model asset inventory:"
          ls -lh app/src/main/assets/models/
          ls -lh app/src/main/assets/needle/

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Debug APK Exists
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "::error::Debug APK not found at app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          echo "Debug APK verified successfully:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: Dexter AI Build ${{ github.run_number }} (Direct APK)
          body: |
            ### Dexter Fully Offline On-Device AI Build ${{ github.run_number }}
            - **Direct Download**: Download `app-debug.apk` directly below (no zip compression).
            - **100% Offline AI**: Pre-bundled with real Laya and Needle 3 neural weights.
            - **Complete Privacy**: Zero telemetry, zero cloud dependencies.
            - **Autonomous Proactive AI**: Evening debrief and smart task completion.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
