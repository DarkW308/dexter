name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Platform 35 and Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Debug Keystore
        run: |
          if [ -f debug.keystore ]; then
            echo "debug.keystore already exists; preserving existing keystore."
          elif [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating debug.keystore."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          mkdir -p app/src/main/assets/models app/src/main/assets/needle
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1

      - name: Upload Build Log on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log

      - name: Verify Debug APK Exists
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "::error::Debug APK not found at app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          echo "Debug APK verified successfully:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: Dexter AI Build ${{ github.run_number }} (Direct APK)
          body: |
            ### Dexter Fully Offline On-Device AI Build ${{ github.run_number }}
            - **Direct Download**: Download `app-debug.apk` directly below (raw binary APK, no zip compression).
            - **3-Model Offline Architecture**: Benchmark Gemma 3 270M-IT, Laya (ModernBERT INT8), and Needle 3 (121M LSAN) side-by-side.
            - **In-App Resource Downloader**: Tap the Status Chip to download verified offline weights directly into private device storage.
            - **100% Offline Privacy**: Zero telemetry, zero cloud dependencies once weights are acquired.
            - **Accurate Intent Routing**: Fixed task fallback bug—Alarms, Journals, Goals, Projects, and Deletions route accurately to their database segments.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
